name: Deploy Next.js to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js project
        run: pnpm build
        env:
          NEXT_PUBLIC_POSTHOG_ID: ${{ secrets.NEXT_PUBLIC_POSTHOG_ID }}

      # 🌟 优化：参考你成功的项目，一次性优雅推送整个 standalone 产物（自带 static 和 public）
      - name: Deploy standalone to VPS (rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: ".next/standalone/"
          TARGET: "/opt/rozy/"
          ARGS: "-avz --delete"

      # 🌟 优化：合并为一个 ssh-action 步骤，顺便用上你习惯的 Here-Doc 和 --update-env
      - name: Update .env and Restart PM2 service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/rozy/
            
            # 使用更规范的 Here-Doc 写入环境变量
            cat <<EOF > .env
            NEXT_PUBLIC_POSTHOG_ID=${{ secrets.NEXT_PUBLIC_POSTHOG_ID }}
            EOF
            
            echo "=== 重启 Next.js 服务 ==="
            # 使用 --update-env 确保 PM2 能够加载到最新的 .env 变量
            pm2 restart rozy-app --update-env || PORT=3000 HOSTNAME="0.0.0.0" pm2 start server.js --name "rozy-app"
            
            pm2 save
            
            echo "✅ Next.js 部署完成！当前状态："
            pm2 status